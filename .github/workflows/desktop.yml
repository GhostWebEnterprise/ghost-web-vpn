name: Desktop App

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-desktop-${{ matrix.os }}
          path: |
            desktop/dist/**
          if-no-files-found: error
