--- 
# yamllint disable rule:line-length
name: VpnHood Verified Android Release

on:
  push:
    branches: [migration/vpnhood-android, main]
    paths:
      - ".github/workflows/vpnhood-release.yml"
      - ".github/workflows/vpnhood-android.yml"
      - ".github/workflows/vpnhood-client-ci.yml"
      - "vpnhood-android/**"
      - "scripts/record-vpnhood-nuget-provenance.py"
      - "tests/test_vpnhood_nuget_provenance.py"
      - "tests/test_vpnhood_activity_lifecycle.py"
      - "tests/test_vpnhood_release_guard.py"
      - "scripts/verify-vpnhood-release-badging.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vpnhood-release.yml"
      - ".github/workflows/vpnhood-android.yml"
      - ".github/workflows/vpnhood-client-ci.yml"
      - "vpnhood-android/**"
      - "scripts/record-vpnhood-nuget-provenance.py"
      - "tests/test_vpnhood_nuget_provenance.py"
      - "tests/test_vpnhood_activity_lifecycle.py"
      - "tests/test_vpnhood_release_guard.py"
      - "scripts/verify-vpnhood-release-badging.sh"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New immutable release tag (vpnhood-android-vN)'
        required: true
        type: string

permissions:
  contents: read

env:
  VPNHOOD_UPSTREAM_REF: 074e4b49b51c15e51aeae0d844cde4f6b02122ec

jobs:
  validate-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android activity session lifecycle contract
        run: python3 -m unittest -v tests/test_vpnhood_activity_lifecycle.py
      - name: Test debuggable APK release guard
        run: python3 -m unittest -v tests/test_vpnhood_release_guard.py
      - name: Test NuGet package provenance recorder
        run: python3 -m unittest -v tests/test_vpnhood_nuget_provenance.py

  verified-release:
    needs: validate-release-guard
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Test Android activity session lifecycle contract
        run: python3 -m unittest -v tests/test_vpnhood_activity_lifecycle.py

      - name: Checkout verified VpnHood source and license
        uses: actions/checkout@v4
        with:
          repository: vpnhood/VpnHood
          ref: ${{ env.VPNHOOD_UPSTREAM_REF }}
          path: vpnhood-upstream
          submodules: recursive

      - name: Verify pinned VpnHood source and LGPL license
        run: |
          set -euo pipefail
          git -C vpnhood-upstream rev-parse HEAD | tee vpnhood-upstream.sha
          test "$(cat vpnhood-upstream.sha)" = "$VPNHOOD_UPSTREAM_REF"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" vpnhood-upstream/LICENSE

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore the GhostWeb VpnHood Android client
        run: dotnet restore vpnhood-android/GhostWeb.VpnHood.Android.csproj
      - name: Record exact restored NuGet package provenance
        run: |
          set -euo pipefail
          python3 scripts/record-vpnhood-nuget-provenance.py \
            --project vpnhood-android/GhostWeb.VpnHood.Android.csproj \
            --upstream-revision-file vpnhood-upstream.sha \
            --output VPNHOOD-NUGET-PACKAGES.txt

      - name: Decode required Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is required"; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostweb-release.jks"
          test -s "$RUNNER_TEMP/ghostweb-release.jks"

      - name: Build signed GhostWeb VpnHood client APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is required"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is required"; exit 1; }
          dotnet publish vpnhood-android/GhostWeb.VpnHood.Android.csproj \
            --configuration Release \
            --framework net10.0-android36.1 \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/ghostweb-release.jks" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:AndroidPackageFormats=apk

      - name: Verify and stage the exact client APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PUBLISH_DIR="vpnhood-android/bin/Release/net10.0-android36.1/publish"
          test -d "$PUBLISH_DIR" || {
            echo "::error::Release publish directory is missing: $PUBLISH_DIR" >&2
            exit 1
          }
          mapfile -t PUBLISHED_APKS < <(find "$PUBLISH_DIR" -type f -name '*.apk' -print | sort)
          mapfile -t SIGNED_APKS < <(find "$PUBLISH_DIR" -type f -name '*-Signed.apk' -print | sort)
          test "${#SIGNED_APKS[@]}" -eq 1 || {
            echo "::error::Expected exactly one signed APK; found ${#SIGNED_APKS[@]} among ${#PUBLISHED_APKS[@]} total publish outputs" >&2
            printf '%s\n' "${PUBLISHED_APKS[@]}"
            exit 1
          }
          APK="${SIGNED_APKS[0]}"
          for candidate in "${PUBLISHED_APKS[@]}"; do
            [[ "$candidate" == "$APK" ]] && continue
            case "$(basename "$candidate" | tr '[:upper:]' '[:lower:]')" in
              *unsigned*) ;;
              *)
                echo "::error::Unexpected additional APK output is not an explicitly unsigned intermediate: $candidate" >&2
                exit 1
                ;;
            esac
          done
          case "$(basename "$APK" | tr '[:upper:]' '[:lower:]')" in
            *unsigned*)
              echo "::error::Unsigned APK refused" >&2
              exit 1
              ;;
          esac
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner" || { echo "::error::apksigner unavailable"; exit 1; }
          test -x "$BUILD_TOOLS/aapt" || { echo "::error::aapt unavailable"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -Fq "Verifies" apksigner.txt || {
            echo "::error::Release APK signature verification did not report Verifies"
            exit 1
          }
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt || {
            echo "::error::APK Signature Scheme v2 is required"
            exit 1
          }
          grep -Fq "Number of signers: 1" apksigner.txt || {
            echo "::error::Expected exactly one release APK signer"
            exit 1
          }
          EXPECTED_SIGNER_SHA256="5b389450352bfe408c0a7be6920f4510e09add61156306a747286125e638dcb9"
          grep -Fq "certificate SHA-256 digest: ${EXPECTED_SIGNER_SHA256}" apksigner.txt || {
            echo "::error::Release signer differs from the existing vpnhood-android-v1 signing identity"
            exit 1
          }
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          bash scripts/verify-vpnhood-release-badging.sh apk-badging.txt
          grep -q "package: name='cfd.ghostbin.ghostwebvpn'" apk-badging.txt
          grep -Eq "launchable-activity: .* icon='[^']*ghostweb_vpn_logo[^']*'" apk-badging.txt || {
            echo "::error::GhostWeb launcher activity icon metadata is missing"
            exit 1
          }
          unzip -l "$APK" > apk-contents.txt
          grep -Fq 'ghostweb_vpn_logo' apk-contents.txt || {
            echo "::error::GhostWeb launcher icon resource is missing from the APK"
            exit 1
          }
          grep -Fq 'lib/arm64-v8a/lib_VpnHood.Client.dll.so' apk-contents.txt || {
            echo "::error::Release APK is missing the compiled VpnHood.Client arm64 library"
            exit 1
          }
          grep -Fq 'lib/arm64-v8a/lib_VpnHood.Client.Device.Android.dll.so' apk-contents.txt || {
            echo "::error::Release APK is missing the compiled VpnHood.Client.Device.Android arm64 library"
            exit 1
          }
          if grep -E 'libwg-go\.so|libwg-quick\.so|libwg\.so' apk-contents.txt; then
            echo "::error::Unexpected WireGuard native libraries in VpnHood APK"
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/GhostWeb-VPN-VpnHood-release.apk
          (cd release && sha256sum GhostWeb-VPN-VpnHood-release.apk) | tee release/GhostWeb-VPN-VpnHood-release.apk.sha256
          (cd release && sha256sum --check GhostWeb-VPN-VpnHood-release.apk.sha256)
          cp apksigner.txt apk-badging.txt apk-contents.txt vpnhood-upstream.sha release/
          cp vpnhood-upstream/LICENSE release/VPNHOOD-LGPL-2.1-LICENSE.txt
          cp vpnhood-android/GhostWeb.VpnHood.Android.csproj release/
          cp VPNHOOD-NUGET-PACKAGES.txt release/
          grep -E 'PackageReference Include="VpnHood\.(Client|Client\.Device\.Android)"' vpnhood-android/GhostWeb.VpnHood.Android.csproj \
            > release/VPNHOOD-CLIENT-DEPENDENCIES.txt
          test -s release/VPNHOOD-CLIENT-DEPENDENCIES.txt

      - name: Upload verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghostweb-vpn-vpnhood-public-release
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable VpnHood release only after byte verification
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^vpnhood-android-v[0-9]+$ ]]; then
            echo "::error::Invalid release tag; expected vpnhood-android-vN"
            exit 1
          fi
          REQUESTED_VERSION="${TAG##*-v}"
          EXISTING_TAG_REFS="$(git ls-remote --tags origin 'refs/tags/vpnhood-android-v*')"
          EXISTING_VERSIONS="$(printf '%s\n' "$EXISTING_TAG_REFS" | awk '{print $2}' | grep -E '^refs/tags/vpnhood-android-v[0-9]+$' | sed 's#^refs/tags/vpnhood-android-v##' | sort -n || true)"
          HIGHEST_VERSION="$(printf '%s\n' "$EXISTING_VERSIONS" | tail -n 1)"
          if [ -n "$HIGHEST_VERSION" ] && [ "$REQUESTED_VERSION" -lt "$HIGHEST_VERSION" ]; then
            echo "::error::Refusing non-monotonic VpnHood release ${TAG}; highest existing tag is vpnhood-android-v${HIGHEST_VERSION}" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to modify existing assets"
            exit 1
          fi
          remote_tags="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          tag_sha="$(printf '%s\n' "$remote_tags" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')"
          peeled_sha="$(printf '%s\n' "$remote_tags" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}')"
          resolved_tag_sha="${peeled_sha:-$tag_sha}"
          if [ -n "$resolved_tag_sha" ]; then
            if [ "$resolved_tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at a different commit; refusing to move it"
              exit 1
            fi
            echo "Tag $TAG already points to this workflow commit; reusing it"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "GhostWeb VPN — VpnHood Android" \
            --notes "GhostWeb VPN Android client built against VpnHood.Client and VpnHood.Client.Device.Android 5.0.616-prerelease. Source/license evidence is attached. The signed APK is verified with apksigner and SHA-256 in CI."
          gh release upload "$TAG" \
            release/GhostWeb-VPN-VpnHood-release.apk \
            release/GhostWeb-VPN-VpnHood-release.apk.sha256 \
            release/apksigner.txt \
            release/VPNHOOD-CLIENT-DEPENDENCIES.txt \
            release/VPNHOOD-NUGET-PACKAGES.txt \
            release/VPNHOOD-LGPL-2.1-LICENSE.txt \
            --repo "$GITHUB_REPOSITORY"
          mkdir -p verified-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'GhostWeb-VPN-VpnHood-release.apk' --dir verified-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'GhostWeb-VPN-VpnHood-release.apk.sha256' --dir verified-release
          cmp -s release/GhostWeb-VPN-VpnHood-release.apk \
            verified-release/GhostWeb-VPN-VpnHood-release.apk || {
              echo "::error::Downloaded release APK differs from verified build"; exit 1;
            }
          cmp -s release/GhostWeb-VPN-VpnHood-release.apk.sha256 \
            verified-release/GhostWeb-VPN-VpnHood-release.apk.sha256 || {
              echo "::error::Downloaded checksum manifest differs"; exit 1;
            }
          (cd verified-release && sha256sum --check GhostWeb-VPN-VpnHood-release.apk.sha256)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'VPNHOOD-NUGET-PACKAGES.txt' --dir verified-release
          cmp -s release/VPNHOOD-NUGET-PACKAGES.txt verified-release/VPNHOOD-NUGET-PACKAGES.txt || {
            echo "::error::Downloaded NuGet package provenance differs from the verified build report"; exit 1;
          }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'apksigner.txt' --dir verified-release
          cmp -s release/apksigner.txt verified-release/apksigner.txt || {
            echo "::error::Downloaded apksigner report differs from the verified build report"; exit 1;
          }
          EXPECTED="$(cut -d' ' -f1 release/GhostWeb-VPN-VpnHood-release.apk.sha256)"
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="GhostWeb-VPN-VpnHood-release.apk") | .digest' \
            | sed 's/^sha256://')"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::GitHub release digest does not match verified APK"; exit 1;
          }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$IS_DRAFT" = false || { echo "::error::Release remains draft"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/ghostweb-release.jks"
          test ! -e "$RUNNER_TEMP/ghostweb-release.jks" || {
            echo "::error::Release keystore cleanup failed"
            exit 1
          }

  # Read-only audit of every published Android APK asset in the repository.
  # This job never modifies releases, creates tags, or publishes APKs.
  audit-legacy-android-assets:
    name: Audit published Android APK signatures (read-only)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Download and verify every published Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/legacy
          download_dir="$RUNNER_TEMP/ghostweb-vpn-published-apks"
          mkdir -p "$download_dir"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || {
            echo "::error::Android build-tools apksigner is unavailable"
            exit 1
          }

          audit_failed=0
          while IFS='|' read -r tag asset expected_size expected_sha256 expected_signer; do
            [ -n "$tag" ] || continue
            url="https://github.com/GhostWebEnterprise/ghost-web-vpn/releases/download/$tag/$asset"
            apk="$download_dir/$tag.apk"
            report="audit/legacy/$tag.apksigner.txt"
            signature_status="unverified"
            actual_size="0"

            if ! curl --fail --location --retry 3 --retry-all-errors "$url" --output "$apk"; then
              echo "::error::Unable to download $tag/$asset"
              audit_failed=1
              printf 'Download failed for %s/%s\n' "$tag" "$asset" > "$report"
              printf 'tag=%s\nasset=%s\nsignature_status=download-failed\n' "$tag" "$asset" > "audit/legacy/$tag.txt"
              continue
            fi

            actual_size="$(stat -c '%s' "$apk")"
            if [ "$actual_size" != "$expected_size" ]; then
              echo "::error::$tag asset size mismatch: expected $expected_size, got $actual_size"
              audit_failed=1
            fi
            if ! printf '%s  %s\n' "$expected_sha256" "$apk" | sha256sum --check -; then
              echo "::error::$tag asset SHA-256 differs from the GitHub release digest"
              audit_failed=1
            fi

            if "$APKSIGNER" verify --verbose --print-certs "$apk" > "$report" 2>&1; then
              signature_status="verified"
              if ! grep -Fq "Verifies" "$report"; then
                echo "::error::$tag APK signer did not report Verifies"
                signature_status="invalid"
                audit_failed=1
              fi
              if ! grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$report"; then
                echo "::error::$tag APK does not have a verified V2 signature"
                signature_status="invalid"
                audit_failed=1
              fi
              if ! grep -Fq "Number of signers: 1" "$report"; then
                echo "::error::$tag APK does not have exactly one signer"
                signature_status="invalid"
                audit_failed=1
              fi
              if [ -n "$expected_signer" ] && ! grep -Fq "certificate SHA-256 digest: $expected_signer" "$report"; then
                echo "::error::$tag APK signer differs from the recorded production identity"
                signature_status="signer-mismatch"
                audit_failed=1
              fi
            else
              signature_status="unsigned-or-unverifiable"
              cat "$report"
              echo "::error::$tag APK is unsigned or its signature cannot be verified"
              audit_failed=1
            fi

            {
              printf 'tag=%s\n' "$tag"
              printf 'asset=%s\n' "$asset"
              printf 'size_bytes=%s\n' "$actual_size"
              printf 'sha256=%s\n' "$expected_sha256"
              printf 'signature_status=%s\n' "$signature_status"
              if [ -n "$expected_signer" ]; then
                printf 'expected_signer_sha256=%s\n' "$expected_signer"
              fi
            } > "audit/legacy/$tag.txt"
          done <<'RELEASE_ASSETS'
          android-v22|app-release-unsigned.apk|15632000|c6fbf50f3cd34e52efed101054feb407c8fe772638826cfab53d4b754a976939|
          android-v24|app-release-unsigned.apk|15632000|c6fbf50f3cd34e52efed101054feb407c8fe772638826cfab53d4b754a976939|
          android-v30|app-release.apk|15640192|e5598fa36cef7475001932a8af1450f7ec2336fe5c51572525a79f831a2d6713|
          android-v31|app-release.apk|15640192|ac82961018fe6b755cc3849f909400ef47d5da050e2f7a99b693926d47a6bc65|
          android-v33|app-release.apk|15640192|c7f16d55d81b9fdbd3f152e862f8b166a49e6c424c4ce3bfbc0746ebb04058d3|
          android-v39|app-release.apk|15640192|a79972605a059ff368b2ba6ea9527e825f9226efa65c0f08cbf447d448deca7a|
          vpnhood-android-v1|GhostWeb-VPN-VpnHood-release.apk|72508762|93b8cdf4f50d55c8cee4446ea83eb0da3ce6cff42b203785611fac002115ed9c|5b389450352bfe408c0a7be6920f4510e09add61156306a747286125e638dcb9
          RELEASE_ASSETS

          if [ -s "$download_dir/android-v22.apk" ] && [ -s "$download_dir/android-v24.apk" ]; then
            if cmp -s "$download_dir/android-v22.apk" "$download_dir/android-v24.apk"; then
              printf 'android-v22 and android-v24 return byte-identical APKs.\n' > audit/legacy/summary.txt
            else
              echo "::error::android-v22 and android-v24 assets do not contain identical bytes"
              audit_failed=1
            fi
          fi

          if [ "$audit_failed" -ne 0 ]; then
            echo "::error::At least one published Android APK failed the signature/provenance audit."
            exit 1
          fi

      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-vpn-apk-signature-audit
          path: audit/legacy/
          if-no-files-found: warn
          retention-days: 30
