name: VpnHood Android Migration

on:
  push:
    branches: [migration/vpnhood-android, main]
    paths:
      - "vpnhood-android/**"
      - "scripts/verify-vpnhood-version-monotonic.py"
      - "tests/test_vpnhood_version_monotonic.py"
      - ".github/workflows/vpnhood-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "vpnhood-android/**"
      - "scripts/verify-vpnhood-version-monotonic.py"
      - "tests/test_vpnhood_version_monotonic.py"
      - ".github/workflows/vpnhood-android.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VPNHOOD_UPSTREAM_REF: 074e4b49b51c15e51aeae0d844cde4f6b02122ec

jobs:
  upstream-source-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GhostWeb migration
        uses: actions/checkout@v4

      - name: Checkout pinned VpnHood upstream
        uses: actions/checkout@v4
        with:
          repository: vpnhood/VpnHood
          ref: ${{ env.VPNHOOD_UPSTREAM_REF }}
          path: vpnhood-upstream
          submodules: recursive

      - name: Validate pinned source, LGPL license and embedded SPA
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="vpnhood-upstream"
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$VPNHOOD_UPSTREAM_REF"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$UPSTREAM/LICENSE"

          PROJECT="$UPSTREAM/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj"
          RESX="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/EmbeddedResource.resx"
          SPA_SOURCE="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/Resources/SPA.zip"
          SPA_RESOURCE="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/resources/spa.zip"

          test -s "$PROJECT"
          test -s "$RESX"
          test -s "$SPA_SOURCE"
          grep -Fq 'resources\spa.zip' "$RESX"

          # The upstream ResXFileRef is lowercase, while the pinned Git tree
          # stores Resources/SPA.zip. Normalize this case-only path on Linux
          # without modifying the upstream checkout's tracked source.
          mkdir -p "$(dirname "$SPA_RESOURCE")"
          cp "$SPA_SOURCE" "$SPA_RESOURCE"
          cmp -s "$SPA_SOURCE" "$SPA_RESOURCE"
          SPA_SHA256="$(sha256sum "$SPA_SOURCE" | cut -d' ' -f1)"
          printf '%s  VpnHood-SPA.zip\n' "$SPA_SHA256" | tee vpnhood-spa.sha256
          git -C "$UPSTREAM" rev-parse HEAD | tee vpnhood-upstream.sha

      - name: Apply isolated GhostWeb app identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("vpnhood-upstream/Src/Apps/Client.Android.Web")

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8-sig")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact branding anchor in {path}; found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              root / "VpnHood.App.Client.Android.Web.csproj",
              "<ApplicationId>com.vpnhood.client.android.web</ApplicationId>",
              "<ApplicationId>cfd.ghostbin.ghostwebvpn</ApplicationId>",
          )
          replace_once(
              root / "AppConfigs.cs",
              'public string AppName { get; init; } = IsDebugMode ? "VpnHOOD! CLIENT (DEBUG)" : "VpnHood! CLIENT";',
              'public string AppName { get; init; } = IsDebugMode ? "GhostWeb VPN (DEBUG)" : "GhostWeb VPN";',
          )
          replace_once(
              root / "AppConfigs.cs",
              'public Uri? UpdateInfoUrl { get; init; } = new ("https://github.com/vpnhood/VpnHood/releases/latest/download/VpnHoodClient-android-web.json");',
              "public Uri? UpdateInfoUrl { get; init; } = null;",
          )
          replace_once(
              root / "Resources/values/strings.xml",
              '<string name="app_name">VpnHood!</string>',
              '<string name="app_name">GhostWeb VPN</string>',
          )
          android_projects = (
              Path("vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj"),
              Path("vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Android.Common/VpnHood.AppLib.Android.Common.csproj"),
              Path("vpnhood-upstream/Src/Core/VpnHood.Core.Client.Device.Android/VpnHood.Core.Client.Device.Android.csproj"),
          )
          old_tfm = "<TargetFramework>net9.0-android35.0</TargetFramework>"
          new_tfm = "<TargetFramework>net10.0-android36.1</TargetFramework>"
          for project in android_projects:
              source = project.read_text(encoding="utf-8-sig")
              if source.count(old_tfm) != 1:
                  raise SystemExit(f"Expected one pinned .NET 9 Android target in {project}")
              project.write_text(source.replace(old_tfm, new_tfm, 1), encoding="utf-8")
          PY
          grep -Fq '<ApplicationId>cfd.ghostbin.ghostwebvpn</ApplicationId>' vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj
          grep -Fq 'GhostWeb VPN' vpnhood-upstream/Src/Apps/Client.Android.Web/AppConfigs.cs
          grep -Fq 'UpdateInfoUrl { get; init; } = null;' vpnhood-upstream/Src/Apps/Client.Android.Web/AppConfigs.cs
          # Preserve VpnHood's legacy storage folder so existing GhostWeb VpnHood tokens remain available.
          grep -Fq 'StorageFolderPath = AppOptions.BuildStorageFolderPath(appId: "VpnHood")' vpnhood-upstream/Src/Apps/Client.Android.Web/App.cs

      - name: Set up .NET 10 LTS for pinned upstream compatibility overlay
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore pinned VpnHood Android client
        run: dotnet restore vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj

      - name: Read canonical GhostWeb Android version for upstream debug build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path("vpnhood-android/GhostWeb.VpnHood.Android.csproj")
          source = project.read_text(encoding="utf-8")
          def read_property(name):
              values = re.findall(rf"<{name}>([^<]+)</{name}>", source)
              if len(values) != 1:
                  raise SystemExit(f"Expected exactly one {name} in {project}; found {len(values)}")
              return values[0].strip()

          code = read_property("ApplicationVersion")
          display = read_property("ApplicationDisplayVersion")
          if not code.isdigit() or not display:
              raise SystemExit("Canonical GhostWeb Android version is invalid")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GHOSTWEB_APP_VERSION_CODE={code}\n")
              env.write(f"GHOSTWEB_APP_VERSION_NAME={display}\n")
          print(f"Using GhostWeb Android versionCode={code}, versionName={display}")
          PY

      - name: Build GhostWeb VpnHood Android debug client
        run: |
          set -euo pipefail
          dotnet build vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj \
            -c Debug --no-restore \
            -p:ApplicationVersion="$GHOSTWEB_APP_VERSION_CODE" \
            -p:ApplicationDisplayVersion="$GHOSTWEB_APP_VERSION_NAME"

      - name: Locate and verify debug APK signature, package and native libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_DIR="vpnhood-upstream/Src/Apps/Client.Android.Web/bin/Debug"
          test -d "$APK_DIR"
          mapfile -t ALL_APKS < <(find "$APK_DIR" -type f -name '*.apk' -print)
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*-Signed.apk' -print)
          test "${#APKS[@]}" -eq 1 || {
            echo "::error::Expected exactly one signed APK; found ${#APKS[@]} signed among ${#ALL_APKS[@]} total build outputs"
            printf '%s\n' "${ALL_APKS[@]}"
            exit 1
          }
          APK="${APKS[0]}"
          case "$(basename "$APK" | tr '[:upper:]' '[:lower:]')" in
            *unsigned*)
              echo "::error::Unsigned VpnHood debug APK refused" >&2
              exit 1
              ;;
          esac

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -Fq "Verifies" apksigner.txt
          grep -Fq "Number of signers: 1" apksigner.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt

          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          LATEST_VPNHOOD_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^vpnhood-android-v[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty')"
          test -n "$LATEST_VPNHOOD_TAG" || { echo "::error::No published VpnHood Android release is available for version comparison"; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous-vpnhood-release"
          gh release download "$LATEST_VPNHOOD_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'GhostWeb-VPN-VpnHood-release.apk' --dir "$RUNNER_TEMP/previous-vpnhood-release"
          PREVIOUS_APK="$RUNNER_TEMP/previous-vpnhood-release/GhostWeb-VPN-VpnHood-release.apk"
          test -s "$PREVIOUS_APK"
          "$BUILD_TOOLS/aapt" dump badging "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-vpnhood-release/apk-badging.txt"
          python3 scripts/verify-vpnhood-version-monotonic.py "$RUNNER_TEMP/previous-vpnhood-release/apk-badging.txt" apk-badging.txt
          grep -Fq "package: name='cfd.ghostbin.ghostwebvpn'" apk-badging.txt
          unzip -l "$APK" | tee apk-contents.txt
          RESOURCE_DLL="vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Resources/bin/Debug/netstandard2.1/VpnHood.AppLib.Resources.dll"
          test -s "$RESOURCE_DLL"
          grep -Fq 'classes.dex' apk-contents.txt
          grep -Fq "application-label:'GhostWeb VPN'" apk-badging.txt
          grep -Fq "application: label='GhostWeb VPN'" apk-badging.txt
          if grep -F -e 'libwg-go.so' -e 'libwg-quick.so' -e 'libwg.so' apk-contents.txt; then
            echo "::error::Legacy WireGuard native library found in VpnHood APK"
            exit 1
          fi
          sha256sum "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Stage debug build evidence
        run: |
          set -euo pipefail
          mkdir -p vpnhood-debug-artifact
          cp "$APK" vpnhood-debug-artifact/GhostWeb-VpnHood-debug.apk
          cp vpnhood-upstream.sha vpnhood-spa.sha256 apksigner.txt apk-badging.txt apk-contents.txt vpnhood-debug-artifact/
          cp vpnhood-upstream/LICENSE vpnhood-debug-artifact/VPNHOOD-LGPL-2.1-LICENSE.txt
          cp vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Resources/Resources/SPA.zip vpnhood-debug-artifact/VpnHood-SPA.zip
          (
            cd vpnhood-debug-artifact
            sha256sum GhostWeb-VpnHood-debug.apk | tee GhostWeb-VpnHood-debug.apk.sha256
            sha256sum --check GhostWeb-VpnHood-debug.apk.sha256
            sha256sum --check vpnhood-spa.sha256
          )

      - name: Upload VpnHood debug APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghostweb-vpn-vpnhood-debug
          path: vpnhood-debug-artifact/
          if-no-files-found: error
          retention-days: 14

  signed-release-build:
    # Never expose release-signing secrets to pull_request or push runs.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: upstream-source-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout GhostWeb migration
        uses: actions/checkout@v4

      - name: Checkout pinned VpnHood upstream
        uses: actions/checkout@v4
        with:
          repository: vpnhood/VpnHood
          ref: ${{ env.VPNHOOD_UPSTREAM_REF }}
          path: vpnhood-upstream
          submodules: recursive

      - name: Validate pinned source and prepare embedded SPA resource
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="vpnhood-upstream"
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$VPNHOOD_UPSTREAM_REF"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "$UPSTREAM/LICENSE"
          PROJECT="$UPSTREAM/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj"
          RESX="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/EmbeddedResource.resx"
          SPA_SOURCE="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/Resources/SPA.zip"
          SPA_RESOURCE="$UPSTREAM/Src/AppLib/VpnHood.AppLib.Resources/resources/spa.zip"
          test -s "$PROJECT"
          test -s "$RESX"
          test -s "$SPA_SOURCE"
          grep -Fq 'resources\spa.zip' "$RESX"
          mkdir -p "$(dirname "$SPA_RESOURCE")"
          cp "$SPA_SOURCE" "$SPA_RESOURCE"
          cmp -s "$SPA_SOURCE" "$SPA_RESOURCE"
          SPA_SHA256="$(sha256sum "$SPA_SOURCE" | cut -d' ' -f1)"
          printf '%s  VpnHood-SPA.zip\n' "$SPA_SHA256" | tee vpnhood-spa.sha256
          git -C "$UPSTREAM" rev-parse HEAD | tee vpnhood-upstream.sha

      - name: Apply isolated GhostWeb release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("vpnhood-upstream/Src/Apps/Client.Android.Web")

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text(encoding="utf-8-sig")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact branding anchor in {path}; found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              root / "VpnHood.App.Client.Android.Web.csproj",
              "<ApplicationId>com.vpnhood.client.android.web</ApplicationId>",
              "<ApplicationId>cfd.ghostbin.ghostwebvpn</ApplicationId>",
          )
          replace_once(
              root / "AppConfigs.cs",
              'public string AppName { get; init; } = IsDebugMode ? "VpnHOOD! CLIENT (DEBUG)" : "VpnHood! CLIENT";',
              'public string AppName { get; init; } = IsDebugMode ? "GhostWeb VPN (DEBUG)" : "GhostWeb VPN";',
          )
          replace_once(
              root / "AppConfigs.cs",
              'public Uri? UpdateInfoUrl { get; init; } = new ("https://github.com/vpnhood/VpnHood/releases/latest/download/VpnHoodClient-android-web.json");',
              "public Uri? UpdateInfoUrl { get; init; } = null;",
          )
          replace_once(
              root / "Resources/values/strings.xml",
              '<string name="app_name">VpnHood!</string>',
              '<string name="app_name">GhostWeb VPN</string>',
          )
          android_projects = (
              Path("vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj"),
              Path("vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Android.Common/VpnHood.AppLib.Android.Common.csproj"),
              Path("vpnhood-upstream/Src/Core/VpnHood.Core.Client.Device.Android/VpnHood.Core.Client.Device.Android.csproj"),
          )
          old_tfm = "<TargetFramework>net9.0-android35.0</TargetFramework>"
          new_tfm = "<TargetFramework>net10.0-android36.1</TargetFramework>"
          for project in android_projects:
              source = project.read_text(encoding="utf-8-sig")
              if source.count(old_tfm) != 1:
                  raise SystemExit(f"Expected one pinned .NET 9 Android target in {project}")
              project.write_text(source.replace(old_tfm, new_tfm, 1), encoding="utf-8")
          PY
          grep -Fq '<ApplicationId>cfd.ghostbin.ghostwebvpn</ApplicationId>' vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj
          grep -Fq 'GhostWeb VPN' vpnhood-upstream/Src/Apps/Client.Android.Web/AppConfigs.cs
          grep -Fq 'UpdateInfoUrl { get; init; } = null;' vpnhood-upstream/Src/Apps/Client.Android.Web/AppConfigs.cs
          # Preserve VpnHood's legacy storage folder so existing GhostWeb VpnHood tokens remain available.
          grep -Fq 'StorageFolderPath = AppOptions.BuildStorageFolderPath(appId: "VpnHood")' vpnhood-upstream/Src/Apps/Client.Android.Web/App.cs

      - name: Set up .NET 10 LTS for pinned upstream compatibility overlay
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore pinned VpnHood Android client
        run: dotnet restore vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj

      - name: Read canonical GhostWeb Android version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path("vpnhood-android/GhostWeb.VpnHood.Android.csproj")
          source = project.read_text(encoding="utf-8")
          def read_property(name):
              values = re.findall(rf"<{name}>([^<]+)</{name}>", source)
              if len(values) != 1:
                  raise SystemExit(f"Expected exactly one {name} in {project}; found {len(values)}")
              return values[0].strip()

          code = read_property("ApplicationVersion")
          display = read_property("ApplicationDisplayVersion")
          if not code.isdigit() or not display:
              raise SystemExit("Canonical GhostWeb Android version is invalid")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GHOSTWEB_APP_VERSION_CODE={code}\n")
              env.write(f"GHOSTWEB_APP_VERSION_NAME={display}\n")
          print(f"Using GhostWeb Android versionCode={code}, versionName={display}")
          PY

      - name: Decode GhostWeb signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostweb-release.jks"
          test -s "$RUNNER_TEMP/ghostweb-release.jks"

      - name: Build signed GhostWeb VpnHood release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          dotnet publish vpnhood-upstream/Src/Apps/Client.Android.Web/VpnHood.App.Client.Android.Web.csproj \
            --configuration Release \
            --framework net10.0-android36.1 \
            -p:ApplicationVersion="$GHOSTWEB_APP_VERSION_CODE" \
            -p:ApplicationDisplayVersion="$GHOSTWEB_APP_VERSION_NAME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/ghostweb-release.jks" \
            -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"

      - name: Verify signed release APK, signer identity, package and native libraries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_DIR="vpnhood-upstream/Src/Apps/Client.Android.Web/bin/Release"
          test -d "$APK_DIR"
          mapfile -t ALL_APKS < <(find "$APK_DIR" -type f -name '*.apk' -print)
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*-Signed.apk' -print)
          test "${#APKS[@]}" -eq 1 || {
            echo "::error::Expected exactly one signed release APK; found ${#APKS[@]} signed among ${#ALL_APKS[@]} total build outputs"
            printf '%s\n' "${ALL_APKS[@]}"
            exit 1
          }
          APK="${APKS[0]}"
          case "$(basename "$APK" | tr '[:upper:]' '[:lower:]')" in
            *unsigned*)
              echo "::error::Unsigned VpnHood release APK refused" >&2
              exit 1
              ;;
          esac

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -Fq "Verifies" apksigner.txt
          grep -Fq "Number of signers: 1" apksigner.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          EXPECTED_SIGNER_SHA256="5b389450352bfe408c0a7be6920f4510e09add61156306a747286125e638dcb9"
          grep -Fq "certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" apksigner.txt || {
            echo "::error::Release signer differs from the existing vpnhood-android-v1 signing identity"
            exit 1
          }

          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          bash scripts/verify-vpnhood-release-badging.sh apk-badging.txt
          LATEST_VPNHOOD_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^vpnhood-android-v[0-9]+$")))] | sort_by(.published_at) | last | .tag_name // empty')"
          test -n "$LATEST_VPNHOOD_TAG" || { echo "::error::No published VpnHood Android release is available for version comparison"; exit 1; }
          mkdir -p "$RUNNER_TEMP/previous-vpnhood-release"
          gh release download "$LATEST_VPNHOOD_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'GhostWeb-VPN-VpnHood-release.apk' --dir "$RUNNER_TEMP/previous-vpnhood-release"
          PREVIOUS_APK="$RUNNER_TEMP/previous-vpnhood-release/GhostWeb-VPN-VpnHood-release.apk"
          test -s "$PREVIOUS_APK"
          "$BUILD_TOOLS/aapt" dump badging "$PREVIOUS_APK" > "$RUNNER_TEMP/previous-vpnhood-release/apk-badging.txt"
          python3 scripts/verify-vpnhood-version-monotonic.py "$RUNNER_TEMP/previous-vpnhood-release/apk-badging.txt" apk-badging.txt
          grep -Fq "package: name='cfd.ghostbin.ghostwebvpn'" apk-badging.txt
          unzip -l "$APK" | tee apk-release-contents.txt
          RESOURCE_DLL="vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Resources/bin/Release/netstandard2.1/VpnHood.AppLib.Resources.dll"
          test -s "$RESOURCE_DLL"
          grep -Fq 'classes.dex' apk-release-contents.txt
          grep -Fq "application-label:'GhostWeb VPN'" apk-badging.txt
          grep -Fq "application: label='GhostWeb VPN'" apk-badging.txt
          if grep -F -e 'libwg-go.so' -e 'libwg-quick.so' -e 'libwg.so' apk-release-contents.txt; then
            echo "::error::Legacy WireGuard native library found in release APK"
            exit 1
          fi

          mkdir -p vpnhood-release-artifact
          cp "$APK" vpnhood-release-artifact/GhostWeb-VPN-VpnHood-release.apk
          cp apksigner.txt apk-badging.txt apk-release-contents.txt vpnhood-upstream.sha vpnhood-spa.sha256 vpnhood-release-artifact/
          cp vpnhood-upstream/LICENSE vpnhood-release-artifact/VPNHOOD-LGPL-2.1-LICENSE.txt
          cp vpnhood-upstream/Src/AppLib/VpnHood.AppLib.Resources/Resources/SPA.zip vpnhood-release-artifact/VpnHood-SPA.zip
          (
            cd vpnhood-release-artifact
            sha256sum GhostWeb-VPN-VpnHood-release.apk | tee GhostWeb-VPN-VpnHood-release.apk.sha256
            sha256sum --check GhostWeb-VPN-VpnHood-release.apk.sha256
            sha256sum --check vpnhood-spa.sha256
          )

      - name: Upload signed VpnHood release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghostweb-vpn-vpnhood-release
          path: vpnhood-release-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/ghostweb-release.jks"
          test ! -e "$RUNNER_TEMP/ghostweb-release.jks" || {
            echo "::error::Release keystore cleanup failed"
            exit 1
          }
