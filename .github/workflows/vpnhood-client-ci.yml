name: GhostWeb VpnHood client compile gate

on:
  push:
    branches: [main, migration/vpnhood-android]
    paths:
      - "vpnhood-android/**"
      - ".github/workflows/vpnhood-client-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vpnhood-android/**"
      - ".github/workflows/vpnhood-client-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ghostweb-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Restore GhostWeb VpnHood Android project
        run: dotnet restore vpnhood-android/GhostWeb.VpnHood.Android.csproj
      - name: Compile GhostWeb VpnHood Android project
        run: |
          set -euo pipefail
          dotnet build vpnhood-android/GhostWeb.VpnHood.Android.csproj \
            --no-restore -c Debug -f net10.0-android36.1
      # Compilation only: never publish or upload an unverified APK.
