name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode=all

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --warning-mode=all

      - name: List APK outputs
        if: always()
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
