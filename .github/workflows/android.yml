name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode=all

      - name: Build release APK
        run: gradle assembleRelease --stacktrace --warning-mode=all

      - name: Verify APK outputs
        run: |
          set -e
          find app/build/outputs -type f -name "*.apk" -print -exec ls -lh {} \;
          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish verified release APK
    needs: build-apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: ghost-web-vpn-release-apk
          path: release-apk

      - name: Verify release artifact
        run: |
          set -e
          find release-apk -type f -name "*.apk" -print -exec ls -lh {} \;
          test -n "$(find release-apk -type f -name '*.apk' -print -quit)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="android-v${{ github.run_number }}"
          gh release create "$TAG" release-apk/*.apk \
            --repo "${{ github.repository }}" \
            --title "Ghost Web VPN Android $TAG" \
            --generate-notes
