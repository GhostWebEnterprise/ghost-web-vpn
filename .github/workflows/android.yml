name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --warning-mode=all

      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Summarize build outputs
        if: always()
        working-directory: android
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-web-vpn-android-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
